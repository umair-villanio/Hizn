[package]
name = "hizn-devices"
description = "Hizn device automation: a thin ADB client plus the one-click setup orchestrator."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["io-util", "net", "time", "process", "fs"] }
serde.workspace = true
serde_json.workspace = true
if-addrs = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
lzma-rs = "0.3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net", "time", "process", "macros", "rt-multi-thread"] }
