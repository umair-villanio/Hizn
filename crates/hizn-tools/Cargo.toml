[package]
name = "hizn-tools"
description = "Hizn Repeater and Intruder: re-send and fuzz HTTP requests."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "gzip", "brotli", "deflate", "zstd"] }
http = "1"
bytes = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
