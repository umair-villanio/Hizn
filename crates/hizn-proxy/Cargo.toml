[package]
name = "hizn-proxy"
description = "Hizn interception engine: HTTP/HTTPS MITM proxy with flow capture."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["io-util", "time"] }
futures-util.workspace = true
serde_json.workspace = true
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
tower-service = "0.3"
indexmap = "2"
# JavaScript-like regexes (lookaround, backreferences) for Match & Replace and scope.
fancy-regex = "0.20"
# Content codecs, so rewritten bodies are re-encoded like mockttp does. All pure Rust.
flate2 = "1"
brotli = "9"
ruzstd = "0.9"

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "time", "macros", "rt-multi-thread"] }
