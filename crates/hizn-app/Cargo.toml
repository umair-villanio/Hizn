[package]
name = "hizn-app"
description = "Hizn desktop app: the Hizn backend in a native window (system webview)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "hizn-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hizn-server = { path = "../hizn-server" }
tokio.workspace = true
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
# Native message / save dialogs, called synchronously from the main thread.
rfd = "0.17"
